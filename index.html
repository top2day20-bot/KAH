<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone Cash - دفع</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 12px 35px #00000018;text-align:center}
.logo{font-size:28px;font-weight:800;color:#e60000;margin-bottom:5px}.sub{color:#666;margin-bottom:22px}
.qr{width:250px;height:250px;margin:0 auto 20px;background:#fff;border:10px solid #fff;border-radius:12px;box-shadow:0 5px 18px #0002}
.qr img{width:100%;height:100%;display:block}
.info{background:#fafafa;border-radius:16px;padding:16px;text-align:right;margin-top:15px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.label{color:#777}.value{font-weight:700;direction:ltr}
.code{margin-top:14px;background:#111;color:#fff;border-radius:13px;padding:13px;font-family:monospace;font-size:16px;direction:ltr;word-break:break-all}
button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:12px;font-size:16px;font-weight:700;cursor:pointer}
.copy{background:#e60000;color:#fff}.copy:active{transform:scale(.98)}
.note{font-size:12px;color:#777;margin-top:14px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Vodafone Cash</div>
  <div class="sub">امسح QR Code لإتمام الدفع</div>

  <div class="qr">
    <img id="qr" alt="QR Code">
  </div>

  <div class="info">
    <div class="row"><span class="label">رقم الاستقبال</span><span class="value" id="phone"></span></div>
  </div>

  <div class="code" id="code"></div>
  <button class="copy" onclick="copyCode()">📋 نسخ كود الدفع</button>

  <div class="note">
    بعد المسح، استخدم كود التحويل الظاهر لإتمام العملية من خلال فودافون كاش.
  </div>
</div>

<script>
// ضع الرقم الجديد هنا
const phone = "01012345678";

// الصيغة المطلوبة بدون شباك في النهاية
const code = `*9*7*${phone}`;

document.getElementById("phone").textContent = phone;
document.getElementById("code").textContent = code;

// إنشاء QR للكود وتفعيله
const qrData = encodeURIComponent(code);
document.getElementById("qr").src =
  `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${qrData}`;

async function copyCode(){
  try{
    await navigator.clipboard.writeText(code);
    const btn=document.querySelector(".copy");
    const old=btn.textContent;
    btn.textContent="✅ تم نسخ الكود";
    setTimeout(()=>btn.textContent=old,1600);
  }catch(e){
    alert("انسخ الكود يدويًا: " + code);
  }
}
</script>
</body>
</html>
